server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Misma origen para la API: evita CORS y funciona igual detrás de un túnel HTTPS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  # Sin caché: así el navegador detecta versiones nuevas del SW y del shell.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
  location = /offline.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Los nombres llevan hash: se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
