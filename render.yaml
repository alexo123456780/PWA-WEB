# Blueprint de Render: New → Blueprint → elegir este repositorio.
# Crea la API (imagen `prod` de apps/api/Dockerfile) y su PostgreSQL, y redespliega con cada push.
databases:
  - name: fieldreport-db
    databaseName: fieldreport
    user: fieldreport
    plan: free # el plan gratuito de PostgreSQL caduca a los 30 días

services:
  - type: web
    name: fieldreport-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free # se duerme tras 15 min sin tráfico: la primera petición tarda ~1 min
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldreport-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render los pide al crear el Blueprint; no se guardan en el repositorio.
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
