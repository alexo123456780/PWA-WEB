name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build -w @fieldreport/api
      - run: npm run build -w @fieldreport/web # incluye el chequeo de tipos de la web y del SW
      - run: npm test -w @fieldreport/web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Entorno
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
      - name: Pruebas de la API (contra PostgreSQL real)
        run: |
          docker compose up -d --build --wait api
          docker compose exec -T api npm test
          docker compose down -v
      - name: Levantar producción local (nginx + API)
        run: docker compose -f docker-compose.prod.yml up -d --build --wait
      - name: E2E de PWA, offline y sincronización
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
